<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>推荐页布局夹具：仅按已提供的容器结构构造</title>
<style>
  body { margin: 0; background: #f5f6fa; }
  .Topstory-container { display: flex; width: 1032px; margin: 10px auto; gap: 10px; padding: 0 16px; box-sizing: border-box; }
  .Topstory-mainColumn { width: 694px; flex-shrink: 0; margin-right: 0; }
  .css-bkewaf { width: 296px; max-width: 296px; flex-shrink: 0; }
  .Card, .feed-card { background: white; padding: 20px; margin-bottom: 10px; }
  .feed-card { border-bottom: 1px solid #eee; }
  .Feed { padding: 0; }
  .ContentItem-title { margin: 0; font-size: 20px; line-height: 29px; }
  .feed-summary { margin: 8px 0; }
</style>
<main>
  <div id="feed-layout" class="Topstory-container css-1ewlo9z">
    <div id="feed-main" class="Topstory-mainColumn css-1ukigou">
      <div id="composer" class="Card">分享此刻的想法 <button id="ask">提问题</button></div>
      <!-- Feed 及其内部祖先链来自用户输出；外层 feed-card 仅模拟既有留白。 -->
      <div class="feed-card">
        <div id="feed-item" class="Feed"><div><div>
          <div class="ContentItem AnswerItem">
            <h2 class="ContentItem-title"><div><a>推荐内容</a></div></h2>
            <p class="feed-summary">信息流摘要文字。</p>
            <details id="expanded-content"><summary id="expand">阅读全文</summary><div id="long-text"></div></details>
            <button id="feed-vote">赞同</button>
          </div>
        </div></div></div>
      </div>
      <div id="other-feed" class="Feed">没有 ContentItem 的其他模块</div>
    </div>
    <div id="feed-sidebar" class="css-bkewaf">
      <a class="css-1qnu4lg"></a><div></div>
      <div class="css-18888ld">
        <div class="css-19idom"><div class="Card CreatorEntrance GlobalSideBar-creator">创作中心</div></div>
        <div class="HotSearchCard">大家都在搜</div>
        <div class="Card">作者平台</div>
      </div>
    </div>
  </div>
  <!-- 不匹配目标结构时，不得仅凭同名外层隐藏旁支。 -->
  <div id="unknown-layout" class="Topstory-container"><div class="other-main">未知布局</div><div id="unknown-sidebar" class="css-bkewaf">保留</div></div>
</main>
</html>
